[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.9.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
addopts = "-m \"not docker\""
markers = [ "docker: builds and runs the container image (run with -m docker)" ]

[tool.pyright]
typeCheckingMode = "strict"
include = [ "src", "tests" ]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
